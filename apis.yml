name: The Coterie
description: >-
  The Coterie is a financial technology company founded in 2022 by Ethan Agarwal,
  Jeson Patel, and Chris Boies to give startup founders access to venture capital
  investments, estate-planning strategies (including its ATOM Trust product), and
  lending. Backed by Andreessen Horowitz, the company has since rebranded and now
  operates as Allocate (allocate.co), positioning itself as "an operating system
  for private markets" serving wealth advisors and asset managers with deal
  sourcing, white-labeled fund creation, AI-powered portfolio management, and
  unified reporting. The company publishes no public API, developer portal, or
  SDKs; this profile captures its identity and public web surface for the API
  Evangelist network.
